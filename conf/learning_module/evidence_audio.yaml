# @package experiment.config.monty_config.learning_modules
# EvidenceGraphLM, speaking audio. The camera LMs tolerate hue drift
# under lighting; this one tolerates pitch drift under vibrato. The
# location already encodes (log-lag, place), so features are the
# second opinion, not the case.
learning_module_0:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  max_match_distance: 0.01
  tolerances:
    audio:
      pitch_hz: 15.0
      place_centroid: 8.0
  feature_weights:
    audio:
      pitch_hz: 1.0
      place_centroid: 1.0
  x_percent_threshold: 20
  evidence_threshold_config: 80%
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    min_post_goal_success_steps: 5
  hypotheses_updater_args:
    max_nneighbors: 10
