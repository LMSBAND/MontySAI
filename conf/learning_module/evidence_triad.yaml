# @package experiment.config.monty_config.learning_modules
# Three cortical columns, one creature: LM0 hears, LM1 sees, LM2
# feels. Tolerances unchanged from the single-sense configs; touch's
# curvature is log10 surface variation (measured mug -1.77, banana
# -1.43), tolerance 0.4 = same order of surface character.
learning_module_0:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  max_match_distance: 0.01
  tolerances:
    audio:
      pitch_semis: 1.362
      place_centroid: 8.0
      timbre: ${np.array:[0.4, 0.4, 0.4, 0.4]}
  feature_weights:
    audio:
      pitch_semis: 1.0
      place_centroid: 1.0
      timbre: ${np.ones:4}
  x_percent_threshold: 20
  evidence_threshold_config: 80%
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    min_post_goal_success_steps: 5
  hypotheses_updater_args:
    max_nneighbors: 10
learning_module_1:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  max_match_distance: 0.01
  tolerances:
    patch:
      opponent: ${np.array:[0.15, 0.15]}
      shade: 0.25
  feature_weights:
    patch:
      opponent: ${np.ones:2}
      shade: 1.0
  x_percent_threshold: 20
  evidence_threshold_config: 80%
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    min_post_goal_success_steps: 5
  hypotheses_updater_args:
    max_nneighbors: 10
learning_module_2:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  max_match_distance: 0.01
  tolerances:
    touch:
      curvature: 0.4
  feature_weights:
    touch:
      curvature: 1.0
  x_percent_threshold: 20
  evidence_threshold_config: 80%
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    min_post_goal_success_steps: 5
  hypotheses_updater_args:
    max_nneighbors: 10
