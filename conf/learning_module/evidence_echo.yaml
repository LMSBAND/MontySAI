# @package experiment.config.monty_config.learning_modules
# EvidenceGraphLM speaking sonar. The geometry carries identity, as
# with touch; strength is the second opinion and its tolerance is
# wide (log10 units; a post at the horizon and one at 2 m differ by
# ~1).
learning_module_0:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  max_match_distance: 0.01
  tolerances:
    sonar:
      strength: 1.0
  feature_weights:
    sonar:
      strength: 0.5
  x_percent_threshold: 20
  evidence_threshold_config: 80%
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    min_post_goal_success_steps: 5
  hypotheses_updater_args:
    max_nneighbors: 10
