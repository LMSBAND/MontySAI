# @package experiment.config.monty_config.learning_modules
# EvidenceGraphLM speaking the reference eye's language: HSV color
# and curvature at metric 3D locations. Same LM machinery and
# thresholds as evidence_retina -- the duel is between coordinate
# choices, not tunings.
learning_module_0:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  max_match_distance: 0.01
  tolerances:
    patch:
      hsv: ${np.array:[0.1, 0.2, 0.2]}
      curvature: 0.4
  feature_weights:
    patch:
      hsv: ${np.ones:3}
      curvature: 1.0
  x_percent_threshold: 20
  evidence_threshold_config: 80%
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    min_post_goal_success_steps: 5
  hypotheses_updater_args:
    max_nneighbors: 10
