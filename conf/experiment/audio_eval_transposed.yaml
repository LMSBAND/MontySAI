# @package _global_
# TEST 1: TRANSPOSITION. The model was trained on the siren at
# 110-220 Hz. Here the banana sings the SAME SHAPE up a perfect
# fifth, 165-330 Hz. In log-lag coordinates that is a pure
# translation, and Monty recognizes objects wherever they sit --
# so the PREDICTION, stated before the run: recognized as banana.
# If this holds, transposition-invariant melody recognition fell
# out of a coordinate choice. The mug stays at its trained pitch
# as the control.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: naive_scan_1
  - /monty/learning_module: evidence_audio
  - /monty/sensor_module: audio
  - /monty/connectivity: 1lm_1audio
  - /environment: audio_mujoco_noop
  - /env_interface: audio_eval_2sounds
  - /env_interface/transform: none
  - /logging: basic_info_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 40
    max_eval_steps: 60
    max_total_steps: 300
    n_train_epochs: 1
    n_eval_epochs: 1
    model_name_or_path: ${path.expanduser:"~/tbp/results/monty/pretrained_models/my_trained_models/audio_pretrain_2sounds/pretrained"}
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 1
    seed: 42
    supervised_lm_ids: []
    environment:
      env_init_args:
        voices:
          banana:
            _target_: audiomonty.voices.Siren
            f0: 165.0
            f1: 330.0
    logging:
      run_name: audio_eval_transposed
