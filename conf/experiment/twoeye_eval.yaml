# @package _global_
# Two same-band eyes voting via MontyConsensus. Prediction: they agree
# on the bowl and CONVICT it -- where the diverse triad refused.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: naive_scan_1
  - /monty/learning_module: evidence_two_eyes
  - /monty/sensor_module: two_eyes
  - /monty/connectivity: 2lm_two_eyes
  - /environment: audio_mujoco_triad
  - /env_interface: audio_eval_2sounds
  - /env_interface/transform: none
  - /logging: basic_info_monty_runs
experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 40
    max_eval_steps: 60
    max_total_steps: 300
    n_train_epochs: 1
    n_eval_epochs: 1
    model_name_or_path: ${path.expanduser:"~/tbp/results/monty/pretrained_models/my_trained_models/twoeye_pretrain/pretrained"}
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 2
    seed: 42
    supervised_lm_ids: []
    logging:
      run_name: twoeye_eval
    monty_config:
      monty_class: ${monty.class:audiomonty.consensus.MontyConsensus}
