# @package experiment.config
# OUT-OF-PLANE: tilt 60 deg about the horizontal (x) axis. The
# transform log-polar does NOT linearize -- foreshortening changes
# the silhouette itself. Pre-registered: this is the metric eye's
# home turf (3D pose hypotheses are built for exactly this); the
# retina may degrade. Either way the eyes become a complementarity
# story, not a horse race.
do_eval: true
eval_env_interface_args:
  object_names:
  - mug
  - banana
  object_init_sampler:
    _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
    rotations:
    - ${np.array:[60.0, 0.0, 0.0]}
eval_env_interface_class: ${monty.class:tbp.monty.experiment.environment.OneObjectPerEpisodeInterface}
