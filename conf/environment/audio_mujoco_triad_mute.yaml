# @package experiment.config.environment
# The MUTE control for the triad: same skull, no voices. A whole
# environment-group swap because hydra dict overrides MERGE (the
# fake-mute lesson).
env_init_args:
  data_path: ${path.expanduser:${oc.env:MONTY_DATA}/mujoco/objects/ycb}
  voices: {}
  listener_agent_id: agent_id_0
  sample_rate: 44100.0
  step_seconds: 0.25
  agents:
    - _target_: tbp.monty.simulators.mujoco.agents.NoopAgent
      _partial_: true
      agent_id: agent_id_0
      sensor_configs:
        audio:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 1
            height: 1
        patch:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
        touch:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 128
            height: 128
      position:
        - 0.0
        - 1.5
        - 0.3
  raise_actuate_missing: false
env_init_func: ${monty.class:audiomonty.audio_env.AudioMuJoCoEnvironment}
