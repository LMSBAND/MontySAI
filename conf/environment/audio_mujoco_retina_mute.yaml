# @package experiment.config.environment
# The silenced world: the MUTE control. Same objects, same eye,
# no voices at all -- whatever recognition survives is vision alone.
# 0.3 m so the object subtends enough pixels for a contour walk
# (~100 on-object at scale 1). The listener still sits still: audio
# extent is the sound's evolution, retinal extent is the internal
# saccade.
env_init_args:
  data_path: ${path.expanduser:${oc.env:MONTY_DATA}/mujoco/objects/ycb}
  voices: {}
  listener_agent_id: agent_id_0
  sample_rate: 44100.0
  step_seconds: 0.25
  agents:
    - _target_: tbp.monty.simulators.mujoco.agents.NoopAgent
      _partial_: true
      agent_id: agent_id_0
      sensor_configs:
        # The ear registered as a sensor on the skull: 1x1 so MuJoCo
        # renders next to nothing, and AudioEnvironment overwrites
        # the "audio" observation with the waveform every step. This
        # is what gives the supervised pretraining a sensor position
        # for the audio LM (offset zero -- same skull as the eye).
        audio:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 1
            height: 1
        patch:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
      position:
        - 0.0
        - 1.5
        - 0.3
  raise_actuate_missing: false
env_init_func: ${monty.class:audiomonty.audio_env.AudioMuJoCoEnvironment}
