experiment:
  config:
    do_eval: false
    do_train: true
    monty_config:
      monty_class: ${monty.class:tbp.monty.frameworks.models.graph_matching.MontyForGraphMatching}
      monty_args:
        num_exploratory_steps: 40
        min_eval_steps: 3
        min_train_steps: 3
      motor_system_config:
        policy_selector:
          policy:
            action_sampler:
              _target_: tbp.monty.frameworks.actions.action_samplers.ConstantSampler
              actions:
              - ${monty.class:tbp.monty.frameworks.actions.actions.LookUp}
              - ${monty.class:tbp.monty.frameworks.actions.actions.LookDown}
              - ${monty.class:tbp.monty.frameworks.actions.actions.TurnLeft}
              - ${monty.class:tbp.monty.frameworks.actions.actions.TurnRight}
            _target_: tbp.monty.frameworks.models.motor_policies.NaiveScanPolicy
            use_goal_driven_actions: false
            agent_id: agent_id_0
            fixed_amount: 1
          _target_: tbp.monty.frameworks.models.motor_policy_selectors.SinglePolicySelector
        _target_: tbp.monty.frameworks.models.motor_system.MotorSystem
      learning_modules:
        learning_module_0:
          _target_: tbp.monty.frameworks.models.displacement_matching.DisplacementGraphLM
          k: 5
          match_attribute: displacement
      sensor_modules:
        sensor_module_0:
          _target_: audiomonty.audio_sm.AudioSM
          sensor_module_id: audio
      sm_to_agent_dict:
        audio: agent_id_0
      sm_to_lm_matrix:
      - - 0
      lm_to_lm_matrix: null
      lm_to_lm_vote_matrix: null
    environment:
      env_init_args:
        data_path: ${path.expanduser:${oc.env:MONTY_DATA}/mujoco/objects/ycb}
        voices:
          mug:
            _target_: audiomonty.voices.drone
          banana:
            _target_: audiomonty.voices.siren
        listener_agent_id: agent_id_0
        sample_rate: 44100.0
        step_seconds: 0.25
        agents:
        - _target_: tbp.monty.simulators.mujoco.agents.NoopAgent
          _partial_: true
          agent_id: agent_id_0
          sensor_configs:
            patch:
              _target_: tbp.monty.frameworks.sensors.SensorConfig
              resolution:
                width: 16
                height: 16
          position:
          - 0.0
          - 1.5
          - 0.4
        raise_actuate_missing: false
      env_init_func: ${monty.class:audiomonty.audio_env.AudioMuJoCoEnvironment}
      transform: null
    train_env_interface_args:
      object_names:
      - mug
      - banana
      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
    train_env_interface_class: ${monty.class:tbp.monty.experiment.environment.OneObjectPerEpisodeInterface}
    logging:
      python_log_level: WARNING
      python_log_to_file: true
      python_log_to_stderr: true
      output_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/my_trained_models}
      monty_data_logger:
        _target_: tbp.monty.frameworks.loggers.exp_logger.BaseMontyLogger
        handlers: []
      run_name: audio_pretrain_2sounds
    show_sensor_output: false
    max_train_steps: 40
    max_eval_steps: 10
    max_total_steps: 200
    n_train_epochs: 1
    n_eval_epochs: 1
    model_name_or_path: ''
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 1
    seed: 42
    supervised_lm_ids: all
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
episodes: all
num_parallel: 16
print_cfg: true
quiet_habitat_logs: true
constants:
  default_all_noise_params:
    features:
      pose_vectors: 2
      hsv: 0.1
      principal_curvatures_log: 0.1
      pose_fully_defined: 0.01
    location: 0.002
  default_sensor_features:
  - pose_vectors
  - pose_fully_defined
  - on_object
  - hsv
  - principal_curvatures_log
  min_eval_steps: 20
  pretrained_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/pretrained_ycb_v13}
  compositional_pretrained_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/pretrained_compositional_objects_v6}
  rotations_all_count: 14
  rotations_all:
  - - 0
    - 0
    - 0
  - - 0
    - 90
    - 0
  - - 0
    - 180
    - 0
  - - 0
    - 270
    - 0
  - - 90
    - 0
    - 0
  - - 90
    - 180
    - 0
  - - 35
    - 45
    - 0
  - - 325
    - 45
    - 0
  - - 35
    - 315
    - 0
  - - 325
    - 315
    - 0
